name: Checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  ADE_TEST_WORKERS: '3'
  ADE_E2E_WORKERS: '3'
  CARGO_BUILD_JOBS: '3'
  NEXTEST_TEST_THREADS: '3'
jobs:
  javascript:
    name: javascript
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --global pnpm@12.1.0
      - run: rustup show
      - run: python3 scripts/install_tools.py
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm check:static --group javascript
        env:
          ADE_STATIC_REPORT_DIR: test-results/ci/javascript
      - run: python3 scripts/ci_build_artifact.py pack javascript test-results/build-javascript
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-javascript-${{ github.sha }}
          path: test-results/build-javascript
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-javascript
          path: test-results/ci/javascript
          if-no-files-found: error
          retention-days: 7
  native:
    name: native
    runs-on: macos-15
    timeout-minutes: 45
    needs: javascript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --global pnpm@12.1.0
      - run: rustup show
      - run: python3 scripts/install_tools.py
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: pnpm install --frozen-lockfile
      - run: xcodebuild -downloadComponent MetalToolchain
      - run: python3 scripts/bootstrap.py
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-javascript-${{ github.sha }}
          path: test-results/build-javascript
      - run: python3 scripts/ci_build_artifact.py restore javascript test-results/build-javascript
      - run: pnpm check:static --group native
        env:
          ADE_STATIC_REPORT_DIR: test-results/ci/native
      - run: pnpm build:backend
      - run: python3 scripts/ci_build_artifact.py pack native test-results/build-native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-native-${{ github.sha }}
          path: test-results/build-native
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-native
          path: test-results/ci/native
          if-no-files-found: error
          retention-days: 7
  protocol:
    name: protocol
    runs-on: macos-15
    timeout-minutes: 45
    needs: [javascript, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --global pnpm@12.1.0
      - run: rustup show
      - run: python3 scripts/install_tools.py
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-javascript-${{ github.sha }}
          path: test-results/build-javascript
      - run: python3 scripts/ci_build_artifact.py restore javascript test-results/build-javascript
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-native-${{ github.sha }}
          path: test-results/build-native
      - run: python3 scripts/ci_build_artifact.py restore native test-results/build-native
      - run: pnpm test:e2e:protocol:only --workers 3
        env:
          ADE_TEST_REPORT_ROOT: test-results/ci
          ADE_REPORT_RUN_ID: ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-protocol
          path: test-results/ci/protocol-ci
          if-no-files-found: error
          retention-days: 7
  desktop:
    name: desktop
    runs-on: macos-15
    timeout-minutes: 45
    needs: [javascript, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --global pnpm@12.1.0
      - run: rustup show
      - run: python3 scripts/install_tools.py
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-javascript-${{ github.sha }}
          path: test-results/build-javascript
      - run: python3 scripts/ci_build_artifact.py restore javascript test-results/build-javascript
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-native-${{ github.sha }}
          path: test-results/build-native
      - run: python3 scripts/ci_build_artifact.py restore native test-results/build-native
      - run: pnpm test:e2e:desktop:only --workers 3
        env:
          ADE_TEST_REPORT_ROOT: test-results/ci
          ADE_REPORT_RUN_ID: ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-desktop
          path: test-results/ci/desktop-ci
          if-no-files-found: error
          retention-days: 7
  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm install --global pnpm@12.1.0
      - run: rustup show
      - run: python3 scripts/install_tools.py
      - run: python3 scripts/bootstrap.py --sources-only
      - run: node scripts/ci-dependencies.mjs
        env:
          ADE_DEPENDENCY_REPORT_DIR: test-results/ci/dependencies
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-dependencies
          path: test-results/ci/dependencies
          if-no-files-found: error
          retention-days: 7
  acceptance:
    name: Acceptance
    runs-on: macos-15
    timeout-minutes: 10
    needs: [javascript, native, protocol, desktop, dependencies]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reports-*
          path: test-results/downloaded
      - run: node scripts/check-ci-evidence.mjs test-results/downloaded
        env:
          ADE_CI_NEEDS: ${{ toJSON(needs) }}
