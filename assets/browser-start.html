<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>lux-ade · Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          13px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        color: #f0f0f0;
        background: #181818;
        -webkit-font-smoothing: antialiased;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 252px);
        text-align: center;
        animation: arrive 180ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        margin: 0 auto 18px;
        border: 1px solid #292b30;
        border-radius: 12px;
        background: #303030;
        color: #f0f0f0;
      }
      svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.25;
      }
      h1 {
        margin: 0 0 7px;
        font-size: 17px;
        font-weight: 500;
        line-height: 1.4;
        letter-spacing: -0.25px;
      }
      p {
        margin: 0;
        color: #aaaaaa;
      }
      .example {
        margin-top: 17px;
        font-size: 11px;
      }
      code {
        display: block;
        margin-top: 3px;
        color: #f0f0f0;
        font:
          11px/1.6 ui-monospace,
          'SFMono-Regular',
          Menlo,
          monospace;
        overflow-wrap: anywhere;
      }
      ::selection {
        color: #f0f0f0;
        background: #454545;
      }
      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        main {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="4.5" width="18" height="15" rx="2.5" />
          <path d="M3 9h18M6.5 6.75h.01m2.5 0h.01" stroke-linecap="round" />
        </svg>
      </div>
      <h1>Open a page</h1>
      <p>Enter an address above to preview<br />a local app or browse a reference.</p>
      <p class="example">For your local app<code>http://localhost:3000</code></p>
    </main>
  </body>
</html>
