[package]
name = "ade-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
thiserror = "2"
anyhow = "1"
base64 = "=0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonc-parser = { version = "=0.33.2", features = ["serde_json"] }
uuid = { version = "1", features = ["v4"] }
schemars = "=1.2.2"
sha2 = "=0.10.9"

[dev-dependencies]
jsonschema = { version = "=0.58.1", default-features = false }
proptest = { version = "1.11", default-features = false, features = ["std"] }
