[package]
name = "ade-daemon"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[[bin]]
name = "ade-daemon"
path = "src/bin/daemon/main.rs"

[dependencies]
ade-core = { path = "../ade-core" }
ade-runtime = { path = "../ade-runtime" }
ade-platform = { path = "../ade-platform" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
sha2 = "=0.10.9"
libc = "0.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tracing = "0.1"
semver = "1"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
