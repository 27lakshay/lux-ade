[package]
name = "ade-platform"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false
links = "ade_platform_native"

[dependencies]
ade-core = { path = "../ade-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }
tracing-appender = "0.2"
libc = "0.2"

[features]
default = []
native-ui = []

[build-dependencies]
cc = "1"
