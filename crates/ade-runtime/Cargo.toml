[package]
name = "ade-runtime"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[features]
default = []
native-terminal = []

[[bin]]
name = "ade-runtime"
path = "src/bin/supervisor/main.rs"
required-features = ["native-terminal"]

[dependencies]
uuid = { version = "1", features = ["v4"] }
ade-core = { path = "../ade-core" }
ade-platform = { path = "../ade-platform" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
sha2 = "=0.10.9"
libc = "0.2"
portable-pty = "0.9"
tracing = "0.1"

[build-dependencies]
cc = "1"
