[package]
name = "ade-client"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[[bin]]
name = "ade-client"
path = "src/main.rs"

[[bin]]
name = "ade-attach"
path = "src/bin/attach/main.rs"

[dependencies]
ade-core = { path = "../ade-core" }
ade-platform = { path = "../ade-platform", features = ["native-ui"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
base64 = "=0.22.1"
gpui-kit = { path = "../../.ade/vendor/gpui-kit/crates/kit", features = ["tree-sitter-python", "tree-sitter-rust", "tree-sitter-javascript", "tree-sitter-typescript", "tree-sitter-tsx", "tree-sitter-bash"] }
gpui-wry = { path = "../../.ade/vendor/gpui-kit/crates/webview", features = ["inspector"] }
wry = { package = "lb-wry", version = "=0.53.3", features = ["devtools"] }
raw-window-handle = "0.6.2"
libc = "0.2"
async-channel = "2.5"

[dev-dependencies]
proptest = "=1.11.0"
gpui-kit = { path = "../../.ade/vendor/gpui-kit/crates/kit", features = ["test-support"] }
