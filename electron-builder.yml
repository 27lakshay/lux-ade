appId: dev.lux.ade
productName: Lux ADE
electronVersion: 44.4.5
directories:
  app: apps/desktop
  output: dist/electron
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
# Electron fuses, flipped in the packaged binary. Two stay on because the app needs them:
# runAsNode lets the packaged Electron binary run ADE's bundled Node tooling (the CLI and provider
# workers, with ELECTRON_RUN_AS_NODE); enableNodeCliInspectArguments lets Playwright drive the
# packaged app in e2e/packaged. Revisit both when the release build gets its own Node and a separate
# test flavour.
electronFuses:
  runAsNode: true
  enableNodeCliInspectArguments: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # Flipping fuses invalidates the binary's signature; an unsigned Apple Silicon build needs a fresh
  # ad-hoc one to launch.
  resetAdHocDarwinSignature: true
mac:
  target: dir
  identity: null
extraFiles:
  - from: .ade/package-stage/ade
    to: MacOS/ade
  - from: target/release/ade-daemon
    to: MacOS/ade-daemon
  - from: target/release/ade-control
    to: MacOS/ade-control
  - from: target/release/ade-runtime
    to: MacOS/ade-runtime
extraResources:
  - from: .ade/package-stage/cli
    to: cli
  - from: .ade/package-stage/client
    to: cli/node_modules/@ade/client
  - from: .ade/package-stage/contracts
    to: cli/node_modules/@ade/contracts
  - from: pnpm-lock.yaml
    to: pnpm-lock.yaml
  - from: .ade/package-stage/providers
    to: providers
  - from: .ade/package-stage/bin
    to: bin
  - from: .ade/package-stage/packages
    to: packages
